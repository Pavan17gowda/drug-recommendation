<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History - DrugGenius</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 20px 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #667eea;
            font-size: 28px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
        }

        .nav-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .nav-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .nav-btn.secondary {
            background: #ff4757;
        }

        .nav-btn.secondary:hover {
            background: #ff3838;
        }

        .filters {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .filter-group label {
            font-size: 12px;
            color: #7f8c8d;
            font-weight: 600;
        }

        .filter-group input,
        .filter-group select {
            padding: 8px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border 0.3s;
        }

        .filter-group input:focus,
        .filter-group select:focus {
            border-color: #667eea;
        }

        .search-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 20px;
        }

        .stats-bar {
            background: white;
            padding: 15px 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .stat-item i {
            font-size: 24px;
            color: #667eea;
        }

        .stat-item .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #2c3e50;
        }

        .stat-item .stat-label {
            font-size: 12px;
            color: #7f8c8d;
        }

        .history-grid {
            display: grid;
            gap: 20px;
        }

        .history-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            transition: all 0.3s;
            border-left: 5px solid #667eea;
        }

        .history-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .card-date {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #7f8c8d;
            font-size: 14px;
        }

        .card-actions {
            display: flex;
            gap: 10px;
        }

        .action-icon {
            width: 35px;
            height: 35px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            border: none;
            font-size: 14px;
        }

        .action-icon.view {
            background: #e3f2fd;
            color: #2196f3;
        }

        .action-icon.download {
            background: #e8f5e9;
            color: #4caf50;
        }

        .action-icon.delete {
            background: #ffebee;
            color: #f44336;
        }

        .action-icon:hover {
            transform: scale(1.1);
        }

        .card-content {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .info-section {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
        }

        .info-section h4 {
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .info-section ul {
            list-style: none;
            padding: 0;
        }

        .info-section li {
            padding: 5px 0;
            color: #555;
            font-size: 13px;
            display: flex;
            align-items: start;
            gap: 8px;
        }

        .info-section li:before {
            content: "•";
            color: #667eea;
            font-weight: bold;
            font-size: 16px;
        }

        .patient-info {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .patient-info-item {
            display: flex;
            flex-direction: column;
        }

        .patient-info-item label {
            font-size: 11px;
            color: #7f8c8d;
            font-weight: 600;
        }

        .patient-info-item span {
            font-size: 14px;
            color: #2c3e50;
            font-weight: 500;
        }

        .disease-badge {
            display: inline-block;
            background: linear-gradient(135deg, #f093fb, #f5576c);
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            margin: 5px 5px 5px 0;
            font-weight: 500;
        }

        .empty-state {
            background: white;
            padding: 60px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .empty-state i {
            font-size: 64px;
            color: #e0e0e0;
            margin-bottom: 20px;
        }

        .empty-state h3 {
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .empty-state p {
            color: #7f8c8d;
            margin-bottom: 20px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 800px;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #ff4757;
            color: white;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 15px;
            }

            .filters {
                flex-direction: column;
            }

            .stats-bar {
                flex-direction: column;
                gap: 15px;
            }

            .card-content {
                grid-template-columns: 1fr;
            }
        }

        @media print {
            body {
                background: white;
            }
            .header, .filters, .stats-bar, .nav-buttons, .card-actions {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-history"></i> Recommendation History</h1>
            <div class="nav-buttons">
                <a href="/" class="nav-btn">
                    <i class="fas fa-home"></i> Home
                </a>
                <a href="/dashboard" class="nav-btn">
                    <i class="fas fa-chart-line"></i> Dashboard
                </a>
                <button class="nav-btn secondary" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </div>

        <div class="filters">
            <div class="filter-group">
                <label>Search Symptoms</label>
                <input type="text" id="searchSymptoms" placeholder="e.g., fever, headache">
            </div>
            <div class="filter-group">
                <label>Disease</label>
                <input type="text" id="searchDisease" placeholder="e.g., diabetes">
            </div>
            <div class="filter-group">
                <label>From Date</label>
                <input type="date" id="fromDate">
            </div>
            <div class="filter-group">
                <label>To Date</label>
                <input type="date" id="toDate">
            </div>
            <button class="search-btn" onclick="filterHistory()">
                <i class="fas fa-search"></i> Filter
            </button>
            <button class="search-btn" onclick="clearFilters()" style="background: #95a5a6;">
                <i class="fas fa-times"></i> Clear
            </button>
        </div>

        <div class="stats-bar">
            <div class="stat-item">
                <i class="fas fa-list"></i>
                <div>
                    <div class="stat-value" id="totalRecords">0</div>
                    <div class="stat-label">Total Records</div>
                </div>
            </div>
            <div class="stat-item">
                <i class="fas fa-calendar"></i>
                <div>
                    <div class="stat-value" id="dateRange">-</div>
                    <div class="stat-label">Date Range</div>
                </div>
            </div>
            <div class="stat-item">
                <i class="fas fa-pills"></i>
                <div>
                    <div class="stat-value" id="uniqueMeds">0</div>
                    <div class="stat-label">Unique Medications</div>
                </div>
            </div>
        </div>

        <div class="history-grid" id="historyGrid">
            <div class="empty-state">
                <i class="fas fa-clipboard-list"></i>
                <h3>No History Found</h3>
                <p>Start by checking your symptoms to build your health history</p>
                <a href="/" class="nav-btn">
                    <i class="fas fa-plus"></i> New Symptom Check
                </a>
            </div>
        </div>
    </div>

    <!-- Detail Modal -->
    <div class="modal" id="detailModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">×</button>
            <div id="modalContent"></div>
        </div>
    </div>

    <script>
        let allHistory = [];
        let filteredHistory = [];

        async function loadHistory() {
            try {
                const response = await fetch('/get-recommendations');
                const data = await response.json();

                if (response.ok) {
                    allHistory = data.history || [];
                    filteredHistory = [...allHistory];
                    displayHistory(filteredHistory);
                    updateStats(filteredHistory);
                }
            } catch (error) {
                console.error('Error loading history:', error);
            }
        }

        function displayHistory(history) {
            const grid = document.getElementById('historyGrid');
            
            if (history.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-clipboard-list"></i>
                        <h3>No History Found</h3>
                        <p>Start by checking your symptoms to build your health history</p>
                        <a href="/" class="nav-btn">
                            <i class="fas fa-plus"></i> New Symptom Check
                        </a>
                    </div>
                `;
                return;
            }

            grid.innerHTML = history.slice().reverse().map((item, index) => {
                const actualIndex = history.length - 1 - index;
                const symptomsId = `symptoms-${actualIndex}`;
                const medsId = `meds-${actualIndex}`;
                
                return `
                <div class="history-card">
                    <div class="card-header">
                        <div class="card-date">
                            <i class="fas fa-calendar-alt"></i>
                            ${formatDateTime(item.date)}
                        </div>
                        <div class="card-actions">
                            <button class="action-icon view" onclick="viewDetails(${actualIndex})" title="View Details">
                                <i class="fas fa-eye"></i>
                            </button>
                            <button class="action-icon download" onclick="downloadRecord(${actualIndex})" title="Download">
                                <i class="fas fa-download"></i>
                            </button>
                            <button class="action-icon delete" onclick="deleteRecord(${actualIndex})" title="Delete">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                    <div class="card-content">
                        <div class="info-section">
                            <h4><i class="fas fa-stethoscope"></i> Symptoms</h4>
                            <ul id="${symptomsId}">
                                ${(item.symptoms || []).slice(0, 5).map(s => `<li>${s}</li>`).join('')}
                            </ul>
                            ${item.symptoms?.length > 5 ? `
                                <li style="color: #667eea; font-weight: 600; cursor: pointer; list-style: none;" onclick="expandSymptoms('${symptomsId}', ${actualIndex})">
                                    <i class="fas fa-plus-circle"></i> +${item.symptoms.length - 5} more
                                </li>
                            ` : ''}
                        </div>
                        <div class="info-section">
                            <h4><i class="fas fa-disease"></i> Identified Diseases</h4>
                            <div>
                                ${(item.diseases || []).map(d => `<span class="disease-badge">${d}</span>`).join('')}
                            </div>
                        </div>
                        <div class="info-section">
                            <h4><i class="fas fa-pills"></i> Medications</h4>
                            <ul id="${medsId}">
                                ${(item.medications || []).slice(0, 4).map(m => `<li>${m}</li>`).join('')}
                            </ul>
                            ${item.medications?.length > 4 ? `
                                <li style="color: #667eea; font-weight: 600; cursor: pointer; list-style: none;" onclick="expandMedications('${medsId}', ${actualIndex})">
                                    <i class="fas fa-plus-circle"></i> +${item.medications.length - 4} more
                                </li>
                            ` : ''}
                        </div>
                        <div class="info-section">
                            <h4><i class="fas fa-user"></i> Patient Info</h4>
                            <div class="patient-info">
                                <div class="patient-info-item">
                                    <label>Age</label>
                                    <span>${item.patientInfo?.age || 'N/A'}</span>
                                </div>
                                <div class="patient-info-item">
                                    <label>Sex</label>
                                    <span>${item.patientInfo?.sex || 'N/A'}</span>
                                </div>
                                <div class="patient-info-item">
                                    <label>BP</label>
                                    <span>${item.patientInfo?.bp || 'N/A'}</span>
                                </div>
                                <div class="patient-info-item">
                                    <label>Temp</label>
                                    <span>${item.patientInfo?.temperature || 'N/A'}°C</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `}).join('');
        }

        function expandSymptoms(elementId, index) {
            const item = allHistory[index];
            const element = document.getElementById(elementId);
            const parent = element.parentElement;
            
            // Replace the entire list with all symptoms
            element.innerHTML = (item.symptoms || []).map(s => `<li>${s}</li>`).join('');
            
            // Remove the "+X more" button
            const moreButton = parent.querySelector('li[onclick*="expandSymptoms"]');
            if (moreButton) {
                moreButton.remove();
            }
        }

        function expandMedications(elementId, index) {
            const item = allHistory[index];
            const element = document.getElementById(elementId);
            const parent = element.parentElement;
            
            // Replace the entire list with all medications
            element.innerHTML = (item.medications || []).map(m => `<li>${m}</li>`).join('');
            
            // Remove the "+X more" button
            const moreButton = parent.querySelector('li[onclick*="expandMedications"]');
            if (moreButton) {
                moreButton.remove();
            }
        }

        function updateStats(history) {
            document.getElementById('totalRecords').textContent = history.length;
            
            if (history.length > 0) {
                const dates = history.map(h => new Date(h.date)).sort((a, b) => a - b);
                const firstDate = dates[0].toLocaleDateString();
                const lastDate = dates[dates.length - 1].toLocaleDateString();
                document.getElementById('dateRange').textContent = firstDate === lastDate ? firstDate : `${firstDate} - ${lastDate}`;
                
                const allMeds = new Set();
                history.forEach(h => {
                    (h.medications || []).forEach(m => allMeds.add(m));
                });
                document.getElementById('uniqueMeds').textContent = allMeds.size;
            } else {
                document.getElementById('dateRange').textContent = '-';
                document.getElementById('uniqueMeds').textContent = '0';
            }
        }

        function filterHistory() {
            const searchSymptoms = document.getElementById('searchSymptoms').value.toLowerCase();
            const searchDisease = document.getElementById('searchDisease').value.toLowerCase();
            const fromDate = document.getElementById('fromDate').value;
            const toDate = document.getElementById('toDate').value;

            filteredHistory = allHistory.filter(item => {
                const matchSymptoms = !searchSymptoms || (item.symptoms || []).some(s => 
                    s.toLowerCase().includes(searchSymptoms)
                );
                const matchDisease = !searchDisease || (item.diseases || []).some(d => 
                    d.toLowerCase().includes(searchDisease)
                );
                const itemDate = new Date(item.date).toISOString().split('T')[0];
                const matchFromDate = !fromDate || itemDate >= fromDate;
                const matchToDate = !toDate || itemDate <= toDate;

                return matchSymptoms && matchDisease && matchFromDate && matchToDate;
            });

            displayHistory(filteredHistory);
            updateStats(filteredHistory);
        }

        function clearFilters() {
            document.getElementById('searchSymptoms').value = '';
            document.getElementById('searchDisease').value = '';
            document.getElementById('fromDate').value = '';
            document.getElementById('toDate').value = '';
            filteredHistory = [...allHistory];
            displayHistory(filteredHistory);
            updateStats(filteredHistory);
        }

        function viewDetails(index) {
            const item = allHistory[index];
            const modal = document.getElementById('detailModal');
            const content = document.getElementById('modalContent');
            
            content.innerHTML = `
                <h2 style="color: #667eea; margin-bottom: 20px;">
                    <i class="fas fa-file-medical"></i> Detailed Report
                </h2>
                <p style="color: #7f8c8d; margin-bottom: 20px;">
                    <i class="fas fa-calendar"></i> ${formatDateTime(item.date)}
                </p>
                
                <div style="margin-bottom: 20px;">
                    <h3 style="color: #2c3e50; margin-bottom: 10px;">Patient Information</h3>
                    <div style="background: #f8f9fa; padding: 15px; border-radius: 10px;">
                        <p><strong>Age:</strong> ${item.patientInfo?.age || 'N/A'}</p>
                        <p><strong>Sex:</strong> ${item.patientInfo?.sex || 'N/A'}</p>
                        <p><strong>Blood Pressure:</strong> ${item.patientInfo?.bp || 'N/A'}</p>
                        <p><strong>Temperature:</strong> ${item.patientInfo?.temperature || 'N/A'}°C</p>
                    </div>
                </div>

                <div style="margin-bottom: 20px;">
                    <h3 style="color: #2c3e50; margin-bottom: 10px;">Symptoms</h3>
                    <div style="background: #f8f9fa; padding: 15px; border-radius: 10px;">
                        ${(item.symptoms || []).map(s => `<span class="disease-badge" style="background: #667eea;">${s}</span>`).join('')}
                    </div>
                </div>

                <div style="margin-bottom: 20px;">
                    <h3 style="color: #2c3e50; margin-bottom: 10px;">Identified Diseases</h3>
                    <div style="background: #f8f9fa; padding: 15px; border-radius: 10px;">
                        ${(item.diseases || []).map(d => `<span class="disease-badge">${d}</span>`).join('')}
                    </div>
                </div>

                <div style="margin-bottom: 20px;">
                    <h3 style="color: #2c3e50; margin-bottom: 10px;">Recommended Medications</h3>
                    <div style="background: #f8f9fa; padding: 15px; border-radius: 10px;">
                        <ul style="list-style: none; padding: 0;">
                            ${(item.medications || []).map(m => `<li style="padding: 5px 0; border-bottom: 1px solid #e0e0e0;">• ${m}</li>`).join('')}
                        </ul>
                    </div>
                </div>

                <div style="background: #fff3cd; padding: 15px; border-radius: 10px; border-left: 4px solid #ffc107;">
                    <strong>Disclaimer:</strong> This is a preliminary recommendation only. Please consult with a healthcare provider before starting any medication.
                </div>
            `;
            
            modal.classList.add('active');
        }

        function closeModal() {
            document.getElementById('detailModal').classList.remove('active');
        }

        function downloadRecord(index) {
            const item = allHistory[index];
            const content = `
DrugGenius - Health Recommendation Report
==========================================

Date: ${formatDateTime(item.date)}

PATIENT INFORMATION
-------------------
Age: ${item.patientInfo?.age || 'N/A'}
Sex: ${item.patientInfo?.sex || 'N/A'}
Blood Pressure: ${item.patientInfo?.bp || 'N/A'}
Temperature: ${item.patientInfo?.temperature || 'N/A'}°C

SYMPTOMS
--------
${(item.symptoms || []).join(', ')}

IDENTIFIED DISEASES
-------------------
${(item.diseases || []).join(', ')}

RECOMMENDED MEDICATIONS
-----------------------
${(item.medications || []).map((m, i) => `${i + 1}. ${m}`).join('\n')}

DISCLAIMER
----------
This is a preliminary recommendation only. Please consult with a healthcare provider before starting any medication.
            `;

            const blob = new Blob([content], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `health-report-${new Date(item.date).toISOString().split('T')[0]}.txt`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function deleteRecord(index) {
            if (confirm('Are you sure you want to delete this record? This cannot be undone.')) {
                allHistory.splice(index, 1);
                filteredHistory = [...allHistory];
                displayHistory(filteredHistory);
                updateStats(filteredHistory);
                // TODO: Send delete request to backend
            }
        }

        function formatDateTime(dateStr) {
            const date = new Date(dateStr);
            return date.toLocaleString('en-US', {
                month: 'short',
                day: 'numeric',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                localStorage.removeItem('userEmail');
                localStorage.removeItem('userName');
                window.location.href = '/';
            }
        }

        // Close modal on outside click
        document.getElementById('detailModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        // Load history on page load
        loadHistory();
    </script>
</body>
</html>
